services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: dekhocampus, POSTGRES_USER: dekhocampus, POSTGRES_PASSWORD: local-only-change-me }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dekhocampus"], interval: 5s, timeout: 3s, retries: 20 }
  backend:
    build: ./backend-java
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dekhocampus
      DATABASE_USER: dekhocampus
      DATABASE_PASSWORD: local-only-change-me
      SECURITY_REQUIRE_AUTH: "false"
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:3000
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    environment: { INTERNAL_API_URL: http://backend:8080/api/v1, NEXT_PUBLIC_SITE_URL: http://localhost:3000 }
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: { postgres-data: {} }
